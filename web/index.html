<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>할일 정리</title>
<style>
  :root, :root[data-theme="light"] {
    --bg: #faf8f4;
    --bg-panel: #ffffff;
    --fg: #17181b;
    --fg-soft: #66625a;
    --fg-faint: #a19c92;
    --line: #e8e4dc;
    --hover: #f1eee7;
    --hover2: #e8e4dc;
    --accent: #e8630a;
    --accent-soft: rgba(232,99,10,.10);
    --input-bg: #ffffff;
    --scrollbar: #d8d3c8;
    --s0-bg: #eeece6; --s0-fg: #66625a;
    --s1-bg: #e5f2ff; --s1-fg: #1478d4;
    --s2-bg: #fdeaea; --s2-fg: #d3382f;
    --s3-bg: #e6f7ef; --s3-fg: #0f8a5f;
    --dl-set-bg: #eeece6; --dl-set-fg: #66625a;
    --dl-soon-bg: #fff2df; --dl-soon-fg: #c17400;
    --dl-over-bg: #fdeaea; --dl-over-fg: #d3382f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0c0d0f;
    --bg-panel: #141518;
    --fg: #f4f2ee;
    --fg-soft: #a4a19a;
    --fg-faint: #6b6862;
    --line: #232427;
    --hover: #1a1b1e;
    --hover2: #232427;
    --accent: #ff7a1a;
    --accent-soft: rgba(255,122,26,.16);
    --input-bg: #17181b;
    --scrollbar: #333437;
    --s0-bg: #1e1f22; --s0-fg: #a4a19a;
    --s1-bg: rgba(79,179,255,.16); --s1-fg: #58b9ff;
    --s2-bg: rgba(255,92,92,.18); --s2-fg: #ff7a7a;
    --s3-bg: rgba(52,211,153,.16); --s3-fg: #3ddba0;
    --dl-set-bg: #1e1f22; --dl-set-fg: #a4a19a;
    --dl-soon-bg: rgba(255,177,64,.18); --dl-soon-fg: #ffb84d;
    --dl-over-bg: rgba(255,92,92,.2); --dl-over-fg: #ff7a7a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    height: 100%; display: flex; flex-direction: column; overflow: hidden;
    font-family: var(--app-font-family, -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Segoe UI", sans-serif);
    background: var(--bg); color: var(--fg); font-size: 14px;
    transition: background .15s, color .15s;
  }
  /* main이 직접 스크롤을 갖고, 스크롤바가 창 오른쪽 끝(리사이즈 손잡이 자리)이
     아니라 살짝 안쪽에서 보이도록 margin으로 띄운다. 폰트 확대(zoom)는 스크롤
     컨테이너인 main 자신이 아니라 안쪽 #mainZoom에만 걸어서, main의 높이 계산이
     확대 배율에 영향받지 않게 한다 (안 그러면 상단에 틈이 생김). */
  main {
    flex: 1 1 auto; min-height: 0; overflow-y: scroll; overflow-x: hidden;
    margin-right: 8px;
  }
  #mainZoom { zoom: 1; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── 커스텀 타이틀바 (프레임 없는 창) ─────────── */
  .titlebar {
    flex: none; z-index: 30; height: 30px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 14px; background: var(--bg);
    border-bottom: 1px solid var(--line);
    -webkit-user-select: none; user-select: none;
  }
  .tb-logo {
    width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); flex: none;
  }
  .tb-title {
    font-size: 11px; letter-spacing: .06em; color: var(--fg-soft); font-weight: 700; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tb-btn {
    flex: none; width: 26px; height: 22px; border: none; background: none;
    color: var(--fg-soft); border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .tb-btn:hover { background: var(--hover2); color: var(--fg); }
  .tb-btn.tb-close:hover { background: var(--s2-bg); color: var(--s2-fg); }
  .tb-btn.active { color: var(--accent); }

  /* ── 리사이즈 핸들 (8방향) ─────────────────────── */
  .rz { position: fixed; z-index: 41; }
  .rz-n, .rz-s { left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
  .rz-n { top: 0; }
  .rz-s { bottom: 0; }
  .rz-w, .rz-e { top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
  .rz-w { left: 0; }
  /* 스크롤바가 main의 margin-right만큼 안쪽에서 보이므로, 가장자리는
     리사이즈 손잡이가 온전히 차지한다 (더 이상 스크롤바와 겹치지 않음). */
  .rz-e { right: 0; width: 8px; }
  .rz-nw, .rz-ne, .rz-sw, .rz-se { width: 12px; height: 12px; }
  .rz-nw { top: 0; left: 0; cursor: nwse-resize; }
  .rz-se {
    bottom: 0; right: 0; cursor: nwse-resize; color: var(--fg-faint);
    display: flex; align-items: center; justify-content: center;
  }
  .rz-se svg { pointer-events: none; }
  .rz-ne { top: 0; right: 0; cursor: nesw-resize; }
  .rz-sw { bottom: 0; left: 0; cursor: nesw-resize; }

  #appContent {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 상단 바 ─────────────────────────────── */
  header {
    flex: none; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 16px 26px 10px;
  }
  .hrow { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-right: 2px; white-space: nowrap; }
  #rootPath {
    font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg-faint); cursor: pointer;
    padding: 3px 8px; border-radius: 5px; background: var(--hover); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 280px;
  }
  #rootPath:hover { color: var(--fg-soft); }
  .spacer { flex: 1; }
  .search-wrap { position: relative; display: flex; align-items: center; width: 200px; }
  .search-wrap svg { position: absolute; left: 9px; pointer-events: none; color: var(--fg-faint); }
  #search {
    width: 100%; padding: 6px 10px 6px 28px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 12.5px; outline: none; background: var(--hover); color: var(--fg);
  }
  #search:focus { border-color: var(--accent); background: var(--bg); }
  button.tool {
    border: 1px solid var(--line); background: var(--bg); color: var(--fg-soft);
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  button.tool:hover { background: var(--hover); color: var(--fg); }
  #btnTheme { width: 32px; height: 30px; padding: 0; justify-content: center; }
  .gcal-panel {
    position: absolute; top: 36px; right: 0; z-index: 25; width: 240px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 12px; font-size: 12px;
  }
  .gcal-panel.hidden { display: none; }
  .gcal-row { color: var(--fg-soft); line-height: 1.6; margin-bottom: 9px; }
  .gcal-actions { display: flex; gap: 6px; }
  .gcal-actions button { flex: 1; padding: 6px 8px; font-size: 12px; justify-content: center; }
  #gcalConnectBtn { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-color: transparent; }
  .settings-sizes { display: flex; gap: 3px; }
  .size-btn {
    flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--fg-soft);
    border-radius: 6px; padding: 6px 1px; font-size: 10.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .size-btn:hover { background: var(--hover); color: var(--fg); }
  .size-btn.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .settings-label { font-size: 11px; color: var(--fg-faint); margin: 10px 0 6px; }
  .settings-label:first-child { margin-top: 0; }
  /* ── 커스텀 드롭다운 (네이티브 select는 프레임 없는 창에서 멈춤 버그가 있어 직접 구현) ── */
  .custom-select { position: relative; }
  .cs-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--fg-soft);
    border-radius: 7px; padding: 6px 10px; font-size: 12.5px; cursor: pointer;
    outline: none; white-space: nowrap; display: flex; align-items: center;
    justify-content: space-between; gap: 8px; font-family: inherit;
  }
  .cs-btn:hover { background: var(--hover); color: var(--fg); }
  .cs-btn svg { flex: none; transition: transform .12s; }
  .cs-btn.open svg { transform: rotate(180deg); }
  .cs-menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 100%;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 4px; font-size: 12.5px;
    max-height: 260px; overflow-y: auto;
  }
  .cs-menu.hidden { display: none; }
  .cs-item {
    padding: 6px 10px; border-radius: 5px; cursor: pointer; color: var(--fg-soft);
    white-space: nowrap;
  }
  .cs-item:hover { background: var(--hover); color: var(--fg); }
  .cs-item.selected { color: var(--accent); font-weight: 600; }
  #summary {
    font-size: 11.5px; color: var(--fg-faint); margin-top: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #summary .urgent { color: var(--s2-fg); }

  /* ── 그룹 ─────────────────────────────── */
  #mainZoom { padding: 8px 26px 40px; max-width: 1200px; margin: 0 auto; }
  .group { margin-top: 20px; border-radius: 8px; }
  .group.drag-over-group { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghead {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 5px; border-radius: 7px; user-select: none;
  }
  .ghead:hover { background: var(--hover); }
  .ghandle, .thandle {
    cursor: grab; color: var(--fg-faint); opacity: .4; line-height: 1;
    padding: 2px 3px; border-radius: 4px; flex: none; display: flex;
  }
  .ghead:hover .ghandle, .task:hover .thandle { opacity: 1; }
  .ghandle:hover, .thandle:hover { background: var(--hover2); color: var(--fg-soft) !important; }
  .chev {
    cursor: pointer; color: var(--fg-faint); width: 20px; height: 20px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; transition: transform .12s;
  }
  .chev:hover { background: var(--hover2); }
  .chev.closed { transform: rotate(-90deg); }
  .gname {
    font-weight: 700; font-size: 14.5px; letter-spacing: -.2px; padding: 2px 6px; border-radius: 4px;
    cursor: text; min-width: 30px; color: var(--fg);
  }
  .gname:hover { background: var(--hover2); }
  .gname input {
    font: inherit; font-weight: 700; border: none; outline: none;
    background: var(--input-bg); border-radius: 4px; padding: 0 2px;
    box-shadow: 0 0 0 2px var(--accent); color: var(--fg);
  }
  .gcount {
    font-size: 11.5px; color: var(--fg-faint); font-weight: 400;
    border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .gdel {
    margin-left: 4px; border: none; background: none; color: var(--fg-faint);
    opacity: .5; cursor: pointer; border-radius: 5px; padding: 4px 6px; display: flex;
  }
  .gdel:hover { opacity: 1; background: var(--s2-bg); color: var(--s2-fg) !important; }
  .gbody { margin-top: 2px; min-height: 6px; }
  .gbody.collapsed { display: none; }
  .empty-hint {
    font-size: 12px; color: var(--fg-faint); border: 1px dashed var(--line);
    border-radius: 8px; padding: 16px 34px; text-align: center;
  }

  /* ── 중분류(서브그룹) ─────────────────────── */
  .subgroup { margin: 8px 0 8px 22px; border-left: 2px solid var(--line); padding-left: 10px; border-radius: 6px; }
  .subgroup.drag-over-group { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sghead {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 5px; border-radius: 6px; user-select: none;
  }
  .sghead:hover { background: var(--hover); }
  .sghandle {
    cursor: grab; color: var(--fg-faint); opacity: .4; line-height: 1;
    padding: 2px 3px; border-radius: 4px; flex: none; display: flex;
  }
  .sghead:hover .sghandle { opacity: 1; }
  .sghandle:hover { background: var(--hover2); color: var(--fg-soft) !important; }
  .sgname {
    font-weight: 600; font-size: 12.5px; letter-spacing: -.1px; padding: 2px 6px; border-radius: 4px;
    cursor: text; min-width: 24px; color: var(--fg-soft);
  }
  .sgname:hover { background: var(--hover2); color: var(--fg); }
  .sgname input {
    font: inherit; font-weight: 600; border: none; outline: none;
    background: var(--input-bg); border-radius: 4px; padding: 0 2px;
    box-shadow: 0 0 0 2px var(--accent); color: var(--fg);
  }
  .sgbody { margin-top: 2px; min-height: 6px; }
  .add-subgroup {
    font-size: 11.5px; color: var(--fg-faint); cursor: pointer; padding: 5px 9px;
    border-radius: 6px; margin: 2px 0 2px 22px; display: inline-block;
  }
  .add-subgroup:hover { background: var(--hover); color: var(--fg-soft); }

  /* ── 업무 행 ─────────────────────────────── */
  .task {
    border-radius: 7px; margin: 1px 0;
  }
  .trow {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px 6px 9px; border-radius: 7px; position: relative;
    border-left: 3px solid transparent;
  }
  .trow:hover { background: var(--hover); }
  .trow.colored { background: var(--task-bg, transparent); }
  .trow.colored:hover { background: var(--task-bg-hover, var(--hover)); }

  .tdot {
    flex: none; width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
    border: 1.5px dashed var(--fg-faint); opacity: .35; display: inline-block;
  }
  .tdot:hover { opacity: 1; }
  .tdot.set { border-style: solid; border-color: transparent; opacity: 1; }

  .color-popup {
    position: fixed; z-index: 45; background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px; width: 168px;
  }
  .color-popup.hidden { display: none; }
  .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .color-swatch {
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-sizing: border-box;
  }
  .color-swatch:hover { border-color: var(--fg-faint); }
  .color-swatch.selected { border-color: var(--fg); }
  .color-clear {
    text-align: center; font-size: 12px; color: var(--fg-soft); cursor: pointer;
    padding: 6px; border-radius: 6px;
  }
  .color-clear:hover { background: var(--hover2); color: var(--fg); }
  .task.dragging { opacity: .35; }
  .task.drop-above > .trow::before,
  .task.drop-below > .trow::after {
    content: ""; position: absolute; left: 6px; right: 6px; height: 2px;
    background: var(--accent); border-radius: 1px;
  }
  .task.drop-above > .trow::before { top: -1px; }
  .task.drop-below > .trow::after { bottom: -1px; }

  .tname {
    font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 38%;
    padding: 1px 3px; border-radius: 3px; color: var(--fg);
  }
  .tname:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .task.done .tname { color: var(--fg-faint); text-decoration: line-through; }
  .task.done .tname:hover { color: var(--accent); }

  .status {
    flex: none; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .status.s0 { background: var(--s0-bg); color: var(--s0-fg); }
  .status.s1 { background: var(--s1-bg); color: var(--s1-fg); }
  .status.s2 { background: var(--s2-bg); color: var(--s2-fg); }
  .status.s3 { background: var(--s3-bg); color: var(--s3-fg); }

  .dl {
    flex: none; font-size: 11px; color: var(--fg-faint); cursor: pointer;
    padding: 2px 9px; border-radius: 20px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .dl svg { flex: none; }
  .dl:hover { background: var(--hover2); }
  .dl.set { background: var(--dl-set-bg); color: var(--dl-set-fg); }
  .dl.soon { background: var(--dl-soon-bg); color: var(--dl-soon-fg); }
  .dl.over { background: var(--dl-over-bg); color: var(--dl-over-fg); font-weight: 700; }
  .dl input[type=date] {
    font: inherit; border: none; outline: none; background: transparent;
    color: inherit; width: 118px; padding: 0;
  }

  .memo {
    flex: 1 1 auto; min-width: 40px; font-size: 12.5px; font-style: italic; color: var(--fg-soft);
    cursor: text; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 2px 6px; border-radius: 5px;
  }
  .memo.empty { color: var(--fg-faint); }
  .memo:hover { background: var(--hover2); }
  .memo input {
    width: 100%; font: inherit; font-style: normal; border: none; outline: none;
    background: var(--input-bg); border-radius: 5px; padding: 0 3px;
    box-shadow: 0 0 0 2px var(--accent); color: var(--fg);
  }

  .tinfo {
    flex: none; font-size: 10.5px; color: var(--fg-faint); white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .tpanel {
    cursor: pointer; color: var(--fg-faint); width: 20px; height: 20px; flex: none;
    display: flex; align-items: center; justify-content: center; border-radius: 4px; opacity: .5;
  }
  .tpanel:hover { background: var(--hover2); color: var(--fg-soft); opacity: 1; }

  /* ── 메모 서식 툴바 ─────────────────────────── */
  .memo-toolbar {
    position: fixed; z-index: 46; display: flex; align-items: center; gap: 4px;
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 6px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .memo-toolbar.hidden { display: none; }
  .memo-toolbar .cs-btn { font-size: 11px; padding: 3px 6px; min-width: 84px; }
  .memo-toolbar button.mt-btn {
    border: 1px solid var(--line); background: var(--bg); color: var(--fg-soft);
    border-radius: 5px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
  }
  .memo-toolbar button.mt-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .mt-size { display: flex; align-items: center; gap: 3px; }
  .mt-size-label { font-size: 11px; color: var(--fg-soft); width: 28px; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── 파일 트리 ─────────────────────────────── */
  .tree { padding: 2px 0 6px 60px; }
  .node { font-size: 12px; }
  .nrow {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px;
    border-radius: 5px; cursor: pointer; color: var(--fg-soft);
  }
  .nrow:hover { background: var(--hover); color: var(--fg); }
  .nicon { flex: none; display: flex; }
  .nname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nkids { padding-left: 18px; }

  /* ── 토스트 ─────────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 9px 18px; border-radius: 8px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 80%; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: .95; }

  #loading {
    padding: 60px; text-align: center; color: var(--fg-faint); font-size: 14px;
  }

  /* ── 업무 상세 대시보드 (노션 스타일 사이드 패널) ─────── */
  .detail-panel {
    position: fixed; top: 30px; right: 0; bottom: 0; width: 320px; z-index: 44;
    background: var(--bg-panel); border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .18s ease;
  }
  .detail-panel.open { transform: translateX(0); }
  .dp-head {
    display: flex; align-items: center; gap: 8px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .dp-title {
    font-size: 14px; font-weight: 700; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .dp-close {
    border: none; background: none; color: var(--fg-faint); cursor: pointer;
    border-radius: 5px; padding: 4px; display: flex;
  }
  .dp-close:hover { background: var(--hover2); color: var(--fg); }
  .dp-body { flex: 1 1 auto; overflow-y: auto; padding: 8px 16px 16px; }
  .dp-section-label {
    font-size: 11px; color: var(--fg-faint); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em;
  }
  .dp-section-label:first-child { margin-top: 2px; }
  .dp-field { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .dp-field-name {
    flex: none; width: 92px; font-size: 12px; color: var(--fg-faint); cursor: text;
    padding-top: 2px; word-break: break-word;
  }
  .dp-field-value { flex: 1; font-size: 13px; color: var(--fg); cursor: text; min-height: 20px; word-break: break-word; }
  .dp-field-value.empty { color: var(--fg-faint); }
  .dp-field input {
    width: 100%; font: inherit; border: none; outline: none;
    background: var(--input-bg); border-radius: 4px; padding: 0 3px;
    box-shadow: 0 0 0 2px var(--accent); color: var(--fg);
  }
  .dp-field-del {
    flex: none; border: none; background: none; color: var(--fg-faint); opacity: .5;
    cursor: pointer; border-radius: 4px; padding: 2px 4px; display: flex; margin-top: 1px;
  }
  .dp-field-del:hover { opacity: 1; background: var(--s2-bg); color: var(--s2-fg) !important; }
  .dp-add-field {
    margin-top: 8px; font-size: 12px; color: var(--fg-faint); cursor: pointer;
    padding: 6px 4px; border-radius: 6px;
  }
  .dp-add-field:hover { background: var(--hover); color: var(--fg-soft); }
</style>
</head>

<script>
"use strict";
const STATUS = [
  { key: "대기",   cls: "s0" },
  { key: "진행중", cls: "s1" },
  { key: "급함",   cls: "s2" },
  { key: "완료",   cls: "s3" },
];

const ICON_HANDLE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="6" r="1.6"></circle><circle cx="8" cy="12" r="1.6"></circle><circle cx="8" cy="18" r="1.6"></circle><circle cx="16" cy="6" r="1.6"></circle><circle cx="16" cy="12" r="1.6"></circle><circle cx="16" cy="18" r="1.6"></circle></svg>';
const ICON_CHEV = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>';
const ICON_TRASH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m2 0-1 13a2 2 0 01-2 2H10a2 2 0 01-2-2L7 7"></path></svg>';
const ICON_CALENDAR = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>';
const ICON_FOLDER = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>';
const ICON_FILE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"></path></svg>';
const ICON_PANEL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>';

let state = null;   // { root, groups:[{id,name,collapsed,tasks:[]}], meta:{} }
let tasks = {};     // id -> {name, category, mtime, fileCount}
let expanded = {};  // taskId -> true (파일 트리 펼침)
let filter = "";
let sortMode = localStorage.getItem("sortMode") || "custom";

const $main = document.getElementById("main");
const $mainZoom = document.getElementById("mainZoom");
const api = () => window.pywebview.api;

/* ── 테마 (라이트/다크/시스템) ─────────────── */
const THEME_ICON = {
  system: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M8 20h8M12 16v4"></path></svg>',
  light: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
  dark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>',
};
function applyTheme() {
  const pref = localStorage.getItem("themePref") || "system";
  const resolved = pref === "system"
    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    : pref;
  document.documentElement.setAttribute("data-theme", resolved);
  const btn = document.getElementById("btnTheme");
  btn.innerHTML = THEME_ICON[pref];
  btn.title = "테마: " + { system: "시스템 설정 따름", light: "라이트", dark: "다크" }[pref]
    + " (클릭해서 전환)";
}
document.getElementById("btnTheme").onclick = () => {
  const order = ["system", "light", "dark"];
  const cur = localStorage.getItem("themePref") || "system";
  const next = order[(order.indexOf(cur) + 1) % order.length];
  localStorage.setItem("themePref", next);
  applyTheme();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if ((localStorage.getItem("themePref") || "system") === "system") applyTheme();
});
applyTheme();

/* ── 정렬 ─────────────────────────────────── */
const SORTERS = {
  name: (a, b) => tasks[a].name.localeCompare(tasks[b].name, "ko"),
  deadline: (a, b) => {
    const da = (state.meta[a] || {}).deadline, db = (state.meta[b] || {}).deadline;
    if (!da && !db) return tasks[a].name.localeCompare(tasks[b].name, "ko");
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? -1 : da > db ? 1 : 0;
  },
  status: (a, b) => {
    const order = { "급함": 0, "진행중": 1, "대기": 2, "완료": 3 };
    const sa = order[(state.meta[a] || {}).status || "대기"];
    const sb = order[(state.meta[b] || {}).status || "대기"];
    return sa - sb || tasks[a].name.localeCompare(tasks[b].name, "ko");
  },
  recent: (a, b) => tasks[b].mtime.localeCompare(tasks[a].mtime),
  files: (a, b) => tasks[b].fileCount - tasks[a].fileCount,
};
function sortTasks(ids) {
  if (sortMode === "custom" || !SORTERS[sortMode]) return ids;
  return ids.slice().sort(SORTERS[sortMode]);
}

/* ── 커스텀 드롭다운 (프레임 없는 창에서 네이티브 select가 멈추는 버그 회피) ── */
function closeAllDropdowns() {
  document.querySelectorAll(".cs-menu").forEach(m => m.classList.add("hidden"));
  document.querySelectorAll(".cs-btn").forEach(b => b.classList.remove("open"));
}
document.addEventListener("click", closeAllDropdowns);

function setupDropdown(btnId, menuId, onSelect) {
  const btn = document.getElementById(btnId);
  const menu = document.getElementById(menuId);
  btn.onclick = e => {
    e.stopPropagation();
    const willOpen = menu.classList.contains("hidden");
    closeAllDropdowns();
    if (willOpen) {
      menu.classList.remove("hidden");
      btn.classList.add("open");
    }
  };
  menu.onclick = e => {
    const item = e.target.closest(".cs-item");
    if (!item) return;
    e.stopPropagation();
    closeAllDropdowns();
    onSelect(item.dataset.value, item.textContent);
  };
  return { btn, menu };
}

const SORT_LABELS = {
  custom: "사용자 지정 순서", name: "이름순", deadline: "마감일순",
  status: "상태순", recent: "최근 수정순", files: "파일 많은순",
};
function setSortSelected(mode) {
  document.getElementById("sortBtnLabel").textContent = SORT_LABELS[mode];
  document.querySelectorAll("#sortMenu .cs-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.value === mode);
  });
}
setSortSelected(sortMode);
setupDropdown("sortBtn", "sortMenu", value => {
  sortMode = value;
  localStorage.setItem("sortMode", sortMode);
  setSortSelected(sortMode);
  render();
});

/* ── 데이터 로드/저장 ─────────────────────── */
async function load(showRemoved) {
  const res = await api().get_state();
  state = res.data;
  tasks = res.tasks;
  render();
  if (!res.rootExists) {
    toast("⚠ 할일 폴더를 찾을 수 없어요: " + state.root);
  } else if (showRemoved && res.removed.length) {
    toast("정리됨(폴더 이동): " + res.removed.join(", "));
  }
}
function save() {
  api().save_state(state);
}
function meta(id) {
  if (!state.meta[id]) state.meta[id] = { memo: "", deadline: "", status: "대기" };
  return state.meta[id];
}

/* ── 렌더링 ─────────────────────────────── */
function render() {
  document.getElementById("rootPath").textContent = state.root;
  const total = Object.keys(tasks).length;
  const done = Object.values(state.meta).filter(m => m.status === "완료").length;
  const urgent = Object.values(state.meta).filter(m => m.status === "급함").length;
  document.getElementById("summary").innerHTML =
    `업무 ${total}건 · 완료 ${done}건` + (urgent ? ` · <span class="urgent">급함 ${urgent}건</span>` : "");

  $mainZoom.innerHTML = "";
  state.groups.forEach(g => $mainZoom.appendChild(renderGroup(g)));
}

function renderGroup(g) {
  if (!g.subgroups) g.subgroups = [];
  const el = document.createElement("section");
  el.className = "group";
  el.dataset.gid = g.id;

  const head = document.createElement("div");
  head.className = "ghead";

  const handle = document.createElement("span");
  handle.className = "ghandle";
  handle.innerHTML = ICON_HANDLE;
  handle.title = "끌어서 그룹 순서 변경";
  handle.draggable = true;
  handle.addEventListener("dragstart", e => startGroupDrag(e, g.id, el));
  handle.addEventListener("dragend", endDrag);

  const chev = document.createElement("span");
  chev.className = "chev" + (g.collapsed ? " closed" : "");
  chev.innerHTML = ICON_CHEV;
  chev.onclick = () => { g.collapsed = !g.collapsed; save(); render(); };

  const name = document.createElement("span");
  name.className = "gname";
  name.textContent = g.name;
  name.title = "클릭하면 그룹 이름을 수정할 수 있어요";
  name.onclick = () => editGroupName(g, name);

  const visible = sortTasks(g.tasks.filter(matchFilter));
  let totalVisible = visible.length;
  g.subgroups.forEach(sg => { totalVisible += sortTasks(sg.tasks.filter(matchFilter)).length; });
  const count = document.createElement("span");
  count.className = "gcount";
  count.textContent = totalVisible;

  const del = document.createElement("button");
  del.className = "gdel";
  del.innerHTML = ICON_TRASH;
  del.title = "그룹 삭제 (업무는 다른 그룹으로 이동)";
  del.onclick = () => deleteGroup(g);

  head.append(handle, chev, name, count, del);

  const body = document.createElement("div");
  body.className = "gbody" + (g.collapsed ? " collapsed" : "");
  body.dataset.gid = g.id;

  if (!visible.length && !g.subgroups.length) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = filter ? "검색 결과 없음" : "업무를 여기로 끌어다 놓을 수 있어요";
    body.appendChild(hint);
  } else {
    visible.forEach(tid => body.appendChild(renderTask(tid, g, null)));
    g.subgroups.forEach(sg => body.appendChild(renderSubgroup(sg, g)));
  }
  const addSg = document.createElement("div");
  addSg.className = "add-subgroup";
  addSg.textContent = "+ 중분류 추가";
  addSg.onclick = () => addSubgroup(g);
  body.appendChild(addSg);

  body.addEventListener("dragover", e => taskDragOverBody(e, g, null));
  body.addEventListener("drop", e => taskDropOnBody(e, g, null));

  el.append(head, body);
  el.addEventListener("dragover", e => groupDragOver(e, g));
  el.addEventListener("drop", e => groupDrop(e, g));
  return el;
}

function renderSubgroup(sg, g) {
  const el = document.createElement("section");
  el.className = "subgroup";
  el.dataset.sgid = sg.id;

  const head = document.createElement("div");
  head.className = "sghead";

  const handle = document.createElement("span");
  handle.className = "sghandle";
  handle.innerHTML = ICON_HANDLE;
  handle.title = "끌어서 중분류 순서 변경";
  handle.draggable = true;
  handle.addEventListener("dragstart", e => startSubgroupDrag(e, g.id, sg.id, el));
  handle.addEventListener("dragend", endDrag);

  const chev = document.createElement("span");
  chev.className = "chev" + (sg.collapsed ? " closed" : "");
  chev.innerHTML = ICON_CHEV;
  chev.onclick = () => { sg.collapsed = !sg.collapsed; save(); render(); };

  const name = document.createElement("span");
  name.className = "sgname";
  name.textContent = sg.name;
  name.title = "클릭하면 중분류 이름을 수정할 수 있어요";
  name.onclick = () => editGroupName(sg, name);

  const visible = sortTasks(sg.tasks.filter(matchFilter));
  const count = document.createElement("span");
  count.className = "gcount";
  count.textContent = visible.length;

  const del = document.createElement("button");
  del.className = "gdel";
  del.innerHTML = ICON_TRASH;
  del.title = "중분류 삭제 (업무는 상위 그룹으로 이동)";
  del.onclick = () => deleteSubgroup(g, sg);

  head.append(handle, chev, name, count, del);

  const body = document.createElement("div");
  body.className = "gbody sgbody" + (sg.collapsed ? " collapsed" : "");
  body.dataset.sgid = sg.id;

  if (!visible.length) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = filter ? "검색 결과 없음" : "업무를 여기로 끌어다 놓을 수 있어요";
    body.appendChild(hint);
  } else {
    visible.forEach(tid => body.appendChild(renderTask(tid, g, sg)));
  }
  body.addEventListener("dragover", e => taskDragOverBody(e, g, sg));
  body.addEventListener("drop", e => taskDropOnBody(e, g, sg));

  el.append(head, body);
  el.addEventListener("dragover", e => subgroupDragOver(e, g, sg));
  el.addEventListener("drop", e => subgroupDrop(e, g, sg));
  return el;
}

function matchFilter(tid) {
  if (!filter) return true;
  const t = tasks[tid];
  const m = state.meta[tid] || {};
  return (t.name + " " + (m.memo || "")).toLowerCase().includes(filter);
}

function renderTask(tid, g, sg) {
  const t = tasks[tid];
  const m = meta(tid);
  const el = document.createElement("div");
  el.className = "task" + (m.status === "완료" ? " done" : "");
  el.dataset.tid = tid;

  const row = document.createElement("div");
  row.className = "trow";

  const handle = document.createElement("span");
  handle.className = "thandle";
  handle.innerHTML = ICON_HANDLE;
  handle.title = sortMode !== "custom"
    ? "끌어서 순서 변경 / 다른 그룹으로 이동 (사용자 지정 순서로 자동 전환돼요)"
    : "끌어서 순서 변경 / 다른 그룹으로 이동";
  handle.draggable = true;
  handle.addEventListener("dragstart", e => startTaskDrag(e, tid, g.id, sg ? sg.id : null, el));
  handle.addEventListener("dragend", endDrag);

  const dot = document.createElement("span");
  dot.className = "tdot" + (m.color ? " set" : "");
  if (m.color) dot.style.background = m.color;
  dot.title = "강조색 지정";
  dot.onclick = e => { e.stopPropagation(); openColorPopup(tid, dot); };

  const chev = document.createElement("span");
  chev.className = "chev" + (expanded[tid] ? "" : " closed");
  chev.innerHTML = ICON_CHEV;
  chev.title = "폴더 내용 펼치기";
  chev.onclick = () => toggleTree(tid, el);

  const st = STATUS.find(s => s.key === m.status) || STATUS[0];
  const status = document.createElement("span");
  status.className = "status " + st.cls;
  status.textContent = st.key;
  status.title = "클릭하면 상태가 바뀌어요 (대기→진행중→급함→완료)";
  status.onclick = () => {
    const i = STATUS.findIndex(s => s.key === m.status);
    m.status = STATUS[(i + 1) % STATUS.length].key;
    save(); render();
  };

  const name = document.createElement("span");
  name.className = "tname";
  name.textContent = t.name;
  name.title = "클릭하면 탐색기로 폴더가 열려요\n" + tid;
  name.onclick = () => api().open_path(tid);

  const dl = renderDeadline(tid, m);

  const memo = document.createElement("span");
  memo.className = "memo" + (m.memo ? "" : " empty");
  memo.textContent = m.memo || "메모 추가…";
  applyMemoStyle(memo, memoStyleOf(m));
  memo.onclick = () => editMemo(m, memo);

  const panelBtn = document.createElement("span");
  panelBtn.className = "tpanel";
  panelBtn.innerHTML = ICON_PANEL;
  panelBtn.title = "상세 정보";
  panelBtn.onclick = e => { e.stopPropagation(); openDetailPanel(tid); };

  const info = document.createElement("span");
  info.className = "tinfo";
  info.textContent = `${t.fileCount}개 · ${t.mtime}`;
  info.title = "파일 수 · 마지막 수정일";

  row.append(handle, dot, chev, status, name, dl, memo, panelBtn, info);
  if (m.color) {
    row.classList.add("colored");
    row.style.borderLeftColor = m.color;
    row.style.setProperty("--task-bg", hexToRgba(m.color, .14));
    row.style.setProperty("--task-bg-hover", hexToRgba(m.color, .24));
  } else {
    row.classList.remove("colored");
    row.style.borderLeftColor = "transparent";
  }
  el.appendChild(row);

  el.addEventListener("dragover", e => taskDragOver(e, tid, g, sg));
  el.addEventListener("drop", e => taskDrop(e, tid, g, sg));

  if (expanded[tid]) {
    const tree = document.createElement("div");
    tree.className = "tree";
    el.appendChild(tree);
    fillTree(tree, tid);
  }
  return el;
}

function renderDeadline(tid, m) {
  const dl = document.createElement("span");
  dl.className = "dl";
  const label = document.createElement("span");
  if (!m.deadline) {
    label.textContent = "마감일 지정";
    dl.title = "마감일 지정";
  } else {
    const d = new Date(m.deadline + "T00:00:00");
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    let tag = diff === 0 ? "D-Day" : diff > 0 ? "D-" + diff : "D+" + (-diff);
    label.textContent = `${m.deadline.slice(5).replace("-", "/")} ${tag}`;
    dl.classList.add("set");
    if (m.status !== "완료") {
      if (diff < 0) dl.classList.add("over");
      else if (diff <= 3) dl.classList.add("soon");
    }
    dl.title = "클릭해서 마감일 변경 (지우려면 달력에서 지우기)";
  }
  dl.innerHTML = ICON_CALENDAR;
  dl.appendChild(label);
  dl.onclick = () => {
    const inp = document.createElement("input");
    inp.type = "date";
    inp.value = m.deadline || "";
    dl.textContent = "";
    dl.appendChild(inp);
    inp.focus();
    try { inp.showPicker(); } catch (e) {}
    const done = () => {
      const next = inp.value || "";
      const changed = next !== (m.deadline || "");
      m.deadline = next;
      save(); render();
      if (changed) syncDeadlineToCalendar(tid, next);
    };
    inp.onchange = done;
    inp.onblur = done;
    dl.onclick = null;
  };
  return dl;
}

/* ── 인라인 편집 ─────────────────────────── */
function editGroupName(g, span) {
  const inp = document.createElement("input");
  inp.value = g.name;
  inp.size = Math.max(g.name.length, 4);
  span.textContent = "";
  span.appendChild(inp);
  inp.focus(); inp.select();
  const done = () => {
    const v = inp.value.trim();
    if (v) g.name = v;
    save(); render();
  };
  inp.onblur = done;
  inp.onkeydown = e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.onblur = null; render(); }
  };
}

function defaultMemoStyle() { return { font: "", bold: false, italic: false, size: 13 }; }
function memoStyleOf(m) {
  if (!m.memoStyle) m.memoStyle = defaultMemoStyle();
  return m.memoStyle;
}
function applyMemoStyle(el, st) {
  el.style.fontFamily = st.font || "";
  el.style.fontWeight = st.bold ? "700" : "400";
  el.style.fontStyle = st.italic ? "italic" : "normal";
  el.style.fontSize = (st.size || 13) + "px";
}

function editMemo(m, span) {
  if (span.querySelector("input")) return; // 이미 편집 중 (더블클릭 등으로 중복 진입하면 툴바가 붕 뜸)
  const inp = document.createElement("input");
  inp.value = m.memo || "";
  inp.placeholder = "메모…";
  applyMemoStyle(inp, memoStyleOf(m));
  span.textContent = "";
  span.classList.remove("empty");
  span.appendChild(inp);
  inp.focus();
  openMemoToolbar(m, inp, span);
  const done = () => {
    m.memo = inp.value.trim();
    closeMemoToolbar();
    save(); render();
  };
  inp.onblur = done;
  inp.onkeydown = e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.onblur = null; closeMemoToolbar(); render(); }
  };
}

/* ── 메모 서식 툴바 (글꼴/굵게/기울임/크기) ─────── */
const $memoToolbar = document.getElementById("memoToolbar");
let memoToolbarTarget = null; // { m, inp }

function openMemoToolbar(m, inp, anchorEl) {
  memoToolbarTarget = { m, inp };
  const st = memoStyleOf(m);
  document.getElementById("memoBoldBtn").classList.toggle("active", !!st.bold);
  document.getElementById("memoItalicBtn").classList.toggle("active", !!st.italic);
  document.getElementById("memoSizeLabel").textContent = (st.size || 13) + "px";
  setMemoFontSelected(st.font || "");
  const r = anchorEl.getBoundingClientRect();
  $memoToolbar.style.left = Math.max(4, r.left) + "px";
  $memoToolbar.style.top = (r.bottom + 4) + "px";
  $memoToolbar.classList.remove("hidden");
}
function closeMemoToolbar() {
  $memoToolbar.classList.add("hidden");
  memoToolbarTarget = null;
}
function setMemoFontSelected(font) {
  let matched = null;
  document.querySelectorAll("#memoFontMenu .cs-item").forEach(el => {
    const sel = el.dataset.value === font;
    el.classList.toggle("selected", sel);
    if (sel) matched = el;
  });
  document.getElementById("memoFontBtnLabel").textContent = matched ? matched.textContent : "기본 글꼴";
}
// 툴바 조작이 메모 입력창의 포커스를 뺏지 않도록 mousedown에서 기본 동작을 막는다.
$memoToolbar.addEventListener("mousedown", e => e.preventDefault());
setupDropdown("memoFontBtn", "memoFontMenu", value => {
  if (!memoToolbarTarget) return;
  const st = memoStyleOf(memoToolbarTarget.m);
  st.font = value;
  setMemoFontSelected(value);
  applyMemoStyle(memoToolbarTarget.inp, st);
});
document.getElementById("memoBoldBtn").onclick = () => {
  if (!memoToolbarTarget) return;
  const st = memoStyleOf(memoToolbarTarget.m);
  st.bold = !st.bold;
  document.getElementById("memoBoldBtn").classList.toggle("active", st.bold);
  applyMemoStyle(memoToolbarTarget.inp, st);
};
document.getElementById("memoItalicBtn").onclick = () => {
  if (!memoToolbarTarget) return;
  const st = memoStyleOf(memoToolbarTarget.m);
  st.italic = !st.italic;
  document.getElementById("memoItalicBtn").classList.toggle("active", st.italic);
  applyMemoStyle(memoToolbarTarget.inp, st);
};
function adjustMemoSize(delta) {
  if (!memoToolbarTarget) return;
  const st = memoStyleOf(memoToolbarTarget.m);
  st.size = Math.max(10, Math.min(28, (st.size || 13) + delta));
  document.getElementById("memoSizeLabel").textContent = st.size + "px";
  applyMemoStyle(memoToolbarTarget.inp, st);
}
document.getElementById("memoSizeDown").onclick = () => adjustMemoSize(-1);
document.getElementById("memoSizeUp").onclick = () => adjustMemoSize(1);

/* ── 업무 상세 대시보드 (노션 스타일 사이드 패널) ─────── */
const $detailPanel = document.getElementById("detailPanel");
const $dpTitle = document.getElementById("dpTitle");
const $dpBody = document.getElementById("dpBody");
let detailPanelTid = null;

function fieldsOf(m) {
  if (!m.fields) m.fields = [];
  return m.fields;
}
function openDetailPanel(tid) {
  detailPanelTid = tid;
  renderDetailPanel();
  $detailPanel.classList.add("open");
}
function closeDetailPanel() {
  $detailPanel.classList.remove("open");
  detailPanelTid = null;
}
document.getElementById("dpClose").onclick = closeDetailPanel;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $detailPanel.classList.contains("open")) closeDetailPanel();
});

function renderDetailPanel() {
  if (!detailPanelTid || !tasks[detailPanelTid]) { closeDetailPanel(); return; }
  const t = tasks[detailPanelTid];
  const m = meta(detailPanelTid);
  $dpTitle.textContent = t.name;
  $dpBody.innerHTML = "";

  const basics = document.createElement("div");
  basics.className = "dp-section-label";
  basics.textContent = "기본 정보";
  $dpBody.appendChild(basics);
  $dpBody.appendChild(renderDetailBasic("상태", m.status || "대기"));
  $dpBody.appendChild(renderDetailBasic("마감일", m.deadline || "지정 안 함"));
  $dpBody.appendChild(renderDetailBasic("메모", m.memo || "없음"));

  const fieldsLabel = document.createElement("div");
  fieldsLabel.className = "dp-section-label";
  fieldsLabel.textContent = "필드";
  $dpBody.appendChild(fieldsLabel);
  fieldsOf(m).forEach(f => $dpBody.appendChild(renderDetailField(m, f)));
  const add = document.createElement("div");
  add.className = "dp-add-field";
  add.textContent = "+ 필드 추가";
  add.onclick = () => {
    const f = { id: Math.random().toString(36).slice(2, 10), name: "새 필드", value: "" };
    fieldsOf(m).push(f);
    save();
    renderDetailPanel();
    const nameEl = $dpBody.querySelector(`[data-fid="${f.id}"] .dp-field-name`);
    if (nameEl) editDetailField(m, f, nameEl, "name");
  };
  $dpBody.appendChild(add);
}

function renderDetailBasic(name, value) {
  const row = document.createElement("div");
  row.className = "dp-field";
  const nameEl = document.createElement("div");
  nameEl.className = "dp-field-name";
  nameEl.textContent = name;
  const valueEl = document.createElement("div");
  valueEl.className = "dp-field-value";
  valueEl.textContent = value;
  row.append(nameEl, valueEl);
  return row;
}

function renderDetailField(m, f) {
  const row = document.createElement("div");
  row.className = "dp-field";
  row.dataset.fid = f.id;

  const name = document.createElement("div");
  name.className = "dp-field-name";
  name.textContent = f.name || "필드명";
  name.onclick = () => editDetailField(m, f, name, "name");

  const value = document.createElement("div");
  value.className = "dp-field-value" + (f.value ? "" : " empty");
  value.textContent = f.value || "값 입력…";
  value.onclick = () => editDetailField(m, f, value, "value");

  const del = document.createElement("button");
  del.className = "dp-field-del";
  del.innerHTML = ICON_TRASH;
  del.title = "필드 삭제";
  del.onclick = () => {
    m.fields = fieldsOf(m).filter(x => x !== f);
    save(); renderDetailPanel();
  };

  row.append(name, value, del);
  return row;
}

function editDetailField(m, f, span, key) {
  const inp = document.createElement("input");
  inp.value = f[key] || "";
  span.textContent = "";
  span.appendChild(inp);
  inp.focus(); inp.select();
  const done = () => {
    f[key] = inp.value.trim();
    save(); renderDetailPanel();
  };
  inp.onblur = done;
  inp.onkeydown = e => {
    if (e.key === "Enter") inp.blur();
    if (e.key === "Escape") { inp.onblur = null; renderDetailPanel(); }
  };
}

/* ── 그룹 추가/삭제 ───────────────────────── */
document.getElementById("btnAddGroup").onclick = () => {
  state.groups.push({ id: Math.random().toString(36).slice(2, 10),
                      name: "새 그룹", collapsed: false, tasks: [] });
  save(); render();
  const spans = document.querySelectorAll(".gname");
  const last = spans[spans.length - 1];
  const g = state.groups[state.groups.length - 1];
  if (last) editGroupName(g, last);
};

function deleteGroup(g) {
  const subTaskCount = (g.subgroups || []).reduce((n, sg) => n + sg.tasks.length, 0);
  const totalTasks = g.tasks.length + subTaskCount;
  if (totalTasks) {
    if (!confirm(`'${g.name}' 그룹을 삭제할까요?\n업무 ${totalTasks}건은 다른 그룹으로 옮겨져요. (폴더는 그대로 유지)`)) return;
    let dest = state.groups.find(x => x !== g);
    if (!dest) {
      dest = { id: Math.random().toString(36).slice(2, 10), name: "미분류",
               collapsed: false, tasks: [], subgroups: [] };
      state.groups.push(dest);
    }
    if (!dest.subgroups) dest.subgroups = [];
    dest.tasks.push(...g.tasks);
    dest.subgroups.push(...(g.subgroups || []));
  }
  state.groups = state.groups.filter(x => x !== g);
  save(); render();
}

// 목록을 스크롤하면 메모 서식 툴바가 원래 위치를 벗어나 붕 뜨는 걸 막기 위해 편집을 마무리한다.
$main.addEventListener("scroll", () => {
  if (memoToolbarTarget) memoToolbarTarget.inp.blur();
});

/* ── 드래그 & 드롭 ────────────────────────── */
let drag = null; // {type:'task'|'group'|'subgroup', tid, gid, sgid}

/* 드래그 중 화면 가장자리 근처로 가면 자동 스크롤 */
let dragPointerY = null;
document.addEventListener("dragover", e => { dragPointerY = e.clientY; });
(function autoScrollLoop() {
  if (drag && dragPointerY !== null) {
    const margin = 90;
    const r = $main.getBoundingClientRect();
    if (dragPointerY < r.top + margin) {
      $main.scrollTop -= Math.max(4, (r.top + margin - dragPointerY) / 3);
    } else if (dragPointerY > r.bottom - margin) {
      $main.scrollTop += Math.max(4, (dragPointerY - (r.bottom - margin)) / 3);
    }
  }
  requestAnimationFrame(autoScrollLoop);
})();

function startTaskDrag(e, tid, gid, sgid, el) {
  drag = { type: "task", tid, gid, sgid };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", tid);
  e.dataTransfer.setDragImage(el, 10, 10);
  requestAnimationFrame(() => el.classList.add("dragging"));
}
function startGroupDrag(e, gid, el) {
  drag = { type: "group", gid };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", gid);
  e.dataTransfer.setDragImage(el, 10, 10);
}
function startSubgroupDrag(e, gid, sgid, el) {
  drag = { type: "subgroup", gid, sgid };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", sgid);
  e.dataTransfer.setDragImage(el, 10, 10);
}
function endDrag() {
  drag = null;
  dragPointerY = null;
  clearMarks();
}
function clearMarks() {
  document.querySelectorAll(".drop-above,.drop-below").forEach(x =>
    x.classList.remove("drop-above", "drop-below"));
  document.querySelectorAll(".drag-over-group").forEach(x =>
    x.classList.remove("drag-over-group"));
}

function taskDragOver(e, tid, g, sg) {
  if (!drag || drag.type !== "task" || drag.tid === tid) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = "move";
  clearMarks();
  const el = e.currentTarget;
  const r = el.querySelector(".trow").getBoundingClientRect();
  const below = e.clientY > r.top + r.height / 2;
  el.classList.add(below ? "drop-below" : "drop-above");
}
function taskDrop(e, tid, g, sg) {
  if (!drag || drag.type !== "task" || drag.tid === tid) return;
  e.preventDefault(); e.stopPropagation();
  const el = e.currentTarget;
  const r = el.querySelector(".trow").getBoundingClientRect();
  const below = e.clientY > r.top + r.height / 2;
  const arr = sg ? sg.tasks : g.tasks;
  moveTask(drag.tid, g, sg, arr.indexOf(tid) + (below ? 1 : 0));
}
function taskDragOverBody(e, g, sg) {
  if (!drag || drag.type !== "task") return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = "move";
}
function taskDropOnBody(e, g, sg) {
  if (!drag || drag.type !== "task") return;
  e.preventDefault(); e.stopPropagation();
  const arr = sg ? sg.tasks : g.tasks;
  moveTask(drag.tid, g, sg, arr.length);
}
function findTaskArray(tid) {
  for (const g of state.groups) {
    if (g.tasks.includes(tid)) return g.tasks;
    for (const sg of g.subgroups || []) {
      if (sg.tasks.includes(tid)) return sg.tasks;
    }
  }
  return null;
}
function moveTask(tid, destGroup, destSub, index) {
  const srcArr = findTaskArray(tid);
  if (!srcArr) return;
  const oldIdx = srcArr.indexOf(tid);
  srcArr.splice(oldIdx, 1);
  const destArr = destSub ? destSub.tasks : destGroup.tasks;
  if (srcArr === destArr && oldIdx < index) index--;
  index = Math.max(0, Math.min(index, destArr.length));
  destArr.splice(index, 0, tid);
  drag = null;
  // 정렬 중(사용자 지정 순서가 아닐 때)에 드래그로 옮기면, 방금 옮긴 결과가
  // 보이도록 사용자 지정 순서로 자동 전환한다 (안 그러면 바로 재정렬돼 원위치처럼 보임).
  if (sortMode !== "custom") {
    sortMode = "custom";
    localStorage.setItem("sortMode", sortMode);
    setSortSelected(sortMode);
  }
  save(); render();
}

function groupDragOver(e, g) {
  if (!drag || drag.type !== "group" || drag.gid === g.id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  clearMarks();
  e.currentTarget.classList.add("drag-over-group");
}
function groupDrop(e, g) {
  if (!drag || drag.type !== "group" || drag.gid === g.id) return;
  e.preventDefault();
  const from = state.groups.findIndex(x => x.id === drag.gid);
  let to = state.groups.findIndex(x => x.id === g.id);
  const [moved] = state.groups.splice(from, 1);
  state.groups.splice(to, 0, moved);
  drag = null;
  save(); render();
}

function subgroupDragOver(e, g, sg) {
  if (!drag || drag.type !== "subgroup" || drag.gid !== g.id || drag.sgid === sg.id) return;
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = "move";
  clearMarks();
  e.currentTarget.classList.add("drag-over-group");
}
function subgroupDrop(e, g, sg) {
  if (!drag || drag.type !== "subgroup" || drag.gid !== g.id || drag.sgid === sg.id) return;
  e.preventDefault(); e.stopPropagation();
  const from = g.subgroups.findIndex(x => x.id === drag.sgid);
  const to = g.subgroups.findIndex(x => x.id === sg.id);
  const [moved] = g.subgroups.splice(from, 1);
  g.subgroups.splice(to, 0, moved);
  drag = null;
  save(); render();
}

/* ── 중분류 추가/삭제 ─────────────────────── */
function addSubgroup(g) {
  if (!g.subgroups) g.subgroups = [];
  const sg = { id: Math.random().toString(36).slice(2, 10),
               name: "새 중분류", collapsed: false, tasks: [] };
  g.subgroups.push(sg);
  save(); render();
  const span = document.querySelector(`.subgroup[data-sgid="${sg.id}"] .sgname`);
  if (span) editGroupName(sg, span);
}
function deleteSubgroup(g, sg) {
  if (sg.tasks.length) {
    if (!confirm(`'${sg.name}' 중분류를 삭제할까요?\n업무 ${sg.tasks.length}건은 '${g.name}' 그룹으로 옮겨져요. (폴더는 그대로 유지)`)) return;
    g.tasks.push(...sg.tasks);
  }
  g.subgroups = g.subgroups.filter(x => x !== sg);
  save(); render();
}

/* ── 파일 트리 ────────────────────────────── */
function toggleTree(tid, el) {
  expanded[tid] = !expanded[tid];
  render();
}
async function fillTree(container, rel) {
  const kids = await api().list_children(rel);
  container.innerHTML = "";
  if (!kids.length) {
    const d = document.createElement("div");
    d.className = "empty-hint";
    d.style.padding = "2px 6px";
    d.textContent = "(비어 있음)";
    container.appendChild(d);
    return;
  }
  kids.forEach(k => container.appendChild(renderNode(k)));
}
function renderNode(k) {
  const el = document.createElement("div");
  el.className = "node";
  const row = document.createElement("div");
  row.className = "nrow";
  const icon = document.createElement("span");
  icon.className = "nicon";
  icon.innerHTML = k.dir ? ICON_FOLDER : ICON_FILE;
  const nm = document.createElement("span");
  nm.className = "nname";
  nm.textContent = k.name;
  row.append(icon, nm);
  el.appendChild(row);

  let open = false, kidsEl = null;
  row.onclick = async () => {
    if (!k.dir) { api().open_path(k.rel); return; }
    if (open) { kidsEl.remove(); kidsEl = null; open = false; return; }
    open = true;
    kidsEl = document.createElement("div");
    kidsEl.className = "nkids";
    el.appendChild(kidsEl);
    await fillTree(kidsEl, k.rel);
  };
  row.ondblclick = () => { if (k.dir) api().open_path(k.rel); };
  if (k.dir) row.title = "클릭: 펼치기 · 더블클릭: 탐색기로 열기";
  else row.title = "클릭하면 파일이 열려요";
  return el;
}
/* ── 기타 ────────────────────────────────── */
document.getElementById("btnRefresh").onclick = () => load(true);
document.getElementById("search").oninput = e => {
  filter = e.target.value.trim().toLowerCase();
  render();
};
document.getElementById("rootPath").onclick = async () => {
  const p = await api().pick_root_folder();
  if (!p || p === state.root) return;
  load(false);
};

/* ── 구글 캘린더 연동 ─────────────────────── */
async function syncDeadlineToCalendar(tid, deadline) {
  if (!state.gcalCalendarId) return;
  const t = tasks[tid];
  if (!t) return;
  const res = await api().gcal_sync_deadline(tid, t.name, deadline, state.gcalCalendarId);
  if (res && res.error) toast("⚠ 캘린더 동기화 실패: " + res.error);
}

const $gcalPanel = document.getElementById("gcalPanel");
document.getElementById("btnGCal").onclick = async e => {
  e.stopPropagation();
  const willOpen = $gcalPanel.classList.contains("hidden");
  $gcalPanel.classList.toggle("hidden");
  if (willOpen) await refreshGcalPanel();
};
document.addEventListener("click", e => {
  if (!$gcalPanel.classList.contains("hidden") &&
      !$gcalPanel.contains(e.target) && e.target.id !== "btnGCal") {
    $gcalPanel.classList.add("hidden");
  }
});

async function refreshGcalPanel() {
  const statusRow = document.getElementById("gcalStatusRow");
  const calRow = document.getElementById("gcalCalRow");
  const connectBtn = document.getElementById("gcalConnectBtn");
  const disconnectBtn = document.getElementById("gcalDisconnectBtn");
  statusRow.innerHTML = "확인 중…";
  calRow.style.display = "none";
  connectBtn.style.display = "none";
  disconnectBtn.style.display = "none";

  const status = await api().gcal_status();
  if (!status.connected) {
    statusRow.textContent = "아직 구글 캘린더에 연결되지 않았어요.";
    connectBtn.style.display = "";
    return;
  }
  statusRow.textContent = "연결됨 · 마감일을 등록하면 자동으로 캘린더에 올라가요";
  disconnectBtn.style.display = "";
  calRow.style.display = "";
  const menu = document.getElementById("gcalMenu");
  const label = document.getElementById("gcalBtnLabel");
  label.textContent = "불러오는 중…";
  menu.innerHTML = "";
  const res = await api().gcal_list_calendars();
  if (res.error) {
    label.textContent = res.error;
    return;
  }
  res.calendars.forEach(c => {
    const item = document.createElement("div");
    item.className = "cs-item";
    item.dataset.value = c.id;
    item.textContent = c.name + (c.primary ? " (기본)" : "");
    if (c.id === state.gcalCalendarId) {
      item.classList.add("selected");
      label.textContent = item.textContent;
    }
    menu.appendChild(item);
  });
  if (!state.gcalCalendarId && res.calendars.length) {
    label.textContent = res.calendars[0].name + (res.calendars[0].primary ? " (기본)" : "");
  }
}
setupDropdown("gcalBtn", "gcalMenu", (value, text) => {
  state.gcalCalendarId = value;
  save();
  document.getElementById("gcalBtnLabel").textContent = text;
  document.querySelectorAll("#gcalMenu .cs-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.value === value);
  });
  toast("캘린더가 설정됐어요: " + text);
});

document.getElementById("gcalConnectBtn").onclick = async () => {
  const btn = document.getElementById("gcalConnectBtn");
  btn.textContent = "브라우저에서 로그인 중…";
  btn.disabled = true;
  const res = await api().gcal_connect();
  btn.disabled = false;
  btn.textContent = "구글 계정 연결";
  if (res.error) { toast("⚠ " + res.error); return; }
  toast("구글 계정이 연결됐어요");
  await refreshGcalPanel();
};
document.getElementById("gcalDisconnectBtn").onclick = async () => {
  await api().gcal_disconnect();
  toast("연결이 해제됐어요");
  await refreshGcalPanel();
};

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}

/* ── 화면 설정 (글꼴 크기·서체) ─────────────── */
function applyFontSettings() {
  const scale = parseInt(localStorage.getItem("uiFontScale") || "100", 10);
  const family = localStorage.getItem("uiFontFamily") || "";
  $mainZoom.style.zoom = scale / 100;
  if (family) document.documentElement.style.setProperty("--app-font-family", family);
  else document.documentElement.style.removeProperty("--app-font-family");
  document.querySelectorAll(".size-btn").forEach(b => {
    b.classList.toggle("selected", parseInt(b.dataset.scale, 10) === scale);
  });
  const items = document.querySelectorAll("#fontMenu .cs-item");
  let matched = null;
  items.forEach(el => {
    const sel = el.dataset.value === family;
    el.classList.toggle("selected", sel);
    if (sel) matched = el;
  });
  document.getElementById("fontBtnLabel").textContent = matched ? matched.textContent : "시스템 기본";
}
document.querySelectorAll(".size-btn").forEach(b => {
  b.onclick = () => {
    localStorage.setItem("uiFontScale", b.dataset.scale);
    applyFontSettings();
  };
});
setupDropdown("fontBtn", "fontMenu", value => {
  localStorage.setItem("uiFontFamily", value);
  applyFontSettings();
});
applyFontSettings();

const $settingsPanel = document.getElementById("settingsPanel");
document.getElementById("btnSettings").onclick = e => {

document.addEventListener("click", e => {

/* ── 업무별 강조색 ─────────────────────────── */
const TASK_COLORS = ["#e03e3e", "#d9730d", "#dfab01", "#0f7b6c", "#0b6e99",
                      "#6940a5", "#ad1a72", "#64473a", "#3b82f6", "#64748b"];
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}
const $colorPopup = document.getElementById("colorPopup");
const $colorGrid = document.getElementById("colorGrid");
let colorPopupTarget = null;
TASK_COLORS.forEach(hex => {
  const sw = document.createElement("div");
  sw.className = "color-swatch";
  sw.style.background = hex;
  sw.dataset.color = hex;
  sw.onclick = () => {
    if (colorPopupTarget) {
      meta(colorPopupTarget).color = hex;
      save(); render();
    }
    $colorPopup.classList.add("hidden");
  };
  $colorGrid.appendChild(sw);
});
document.getElementById("colorClearBtn").onclick = () => {
  if (colorPopupTarget) {
    delete meta(colorPopupTarget).color;
    save(); render();
  }
  $colorPopup.classList.add("hidden");
};
function openColorPopup(tid, anchorEl) {
  colorPopupTarget = tid;
  const m = meta(tid);
  $colorGrid.querySelectorAll(".color-swatch").forEach(sw => {
    sw.classList.toggle("selected", sw.dataset.color === m.color);
  });
  const r = anchorEl.getBoundingClientRect();
  $colorPopup.style.left = r.left + "px";
  $colorPopup.style.top = (r.bottom + 4) + "px";
  $colorPopup.classList.remove("hidden");
}
document.addEventListener("click", e => {
  if (!$colorPopup.classList.contains("hidden") &&
      !$colorPopup.contains(e.target) && !e.target.classList.contains("tdot")) {
    $colorPopup.classList.add("hidden");
  }
});

/* ── 커스텀 타이틀바 (프레임 없는 창 제어) ─────── */
document.getElementById("tbMin").onclick = () => api().minimize_window();

const ICON_MAXIMIZE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg>';
const ICON_RESTORE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="13" height="13" rx="1"></rect><path d="M4 17V6a2 2 0 012-2h11"></path></svg>';
const $tbMax = document.getElementById("tbMax");
let isMaximized = false;
function setMaxIcon() {
  $tbMax.innerHTML = isMaximized ? ICON_RESTORE : ICON_MAXIMIZE;
  $tbMax.title = isMaximized ? "이전 크기로" : "최대화";
}
async function toggleMaximize() {
  if (isMaximized) await api().restore_window();
  else await api().maximize_window();
  isMaximized = !isMaximized;
  setMaxIcon();
}
setMaxIcon();
$tbMax.onclick = toggleMaximize;
document.querySelector(".titlebar").addEventListener("dblclick", e => {
  if (e.target.closest(".tb-btn")) return;
  toggleMaximize();
});

(function setupResize() {
  document.querySelectorAll(".rz").forEach(handle => {
    const dir = handle.className.match(/rz-(\w+)/)[1]; // n, s, e, w, nw, ne, sw, se
    const fp = parseInt(handle.dataset.fp, 10);
    let startX, startY, startW, startH, dragging = false, pending = false;
    handle.addEventListener("mousedown", e => {
      e.preventDefault();
      dragging = true;
      startX = e.screenX; startY = e.screenY;
      startW = window.innerWidth; startH = window.innerHeight;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
    function onMove(e) {
      if (!dragging) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      let w = startW, h = startH;
      if (dir.includes("e")) w = startW + dx;
      if (dir.includes("w")) w = startW - dx;
      if (dir.includes("s")) h = startH + dy;
      if (dir.includes("n")) h = startH - dy;
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        api().resize_window(w, h, fp);
        pending = false;
      });
    }
    function onUp() {
      dragging = false;
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
  });
})();

window.addEventListener("pywebviewready", () => load(true));
